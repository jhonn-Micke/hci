<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica de Interfaces - Control de Avatar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light user-select-none d-flex flex-column align-items-center justify-content-center min-vh-100 p-3">

    <h4 class="mb-3 text-secondary text-center fw-bold">Interfaz para pantalla pequeña</h4>

    <div id="board" 
         class="border border-2 border-secondary shadow-sm bg-white rounded mb-4" 
         style="width: 100%; max-width: 320px; aspect-ratio: 1 / 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); touch-action: none;">
        
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-0-0"></div>
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-0-1"></div>
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-0-2"></div>
        
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-1-0"></div>
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-1-1">
            <img id="avatar" src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png" alt="Avatar" class="img-fluid p-2" style="max-height: 80%;">
        </div>
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-1-2"></div>
        
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-2-0"></div>
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-2-1"></div>
        <div class="border border-secondary d-flex align-items-center justify-content-center overflow-hidden" id="cell-2-2"></div>

    </div>

    <div class="d-flex gap-2 mb-4">
        <button class="btn btn-outline-secondary fs-3 shadow-sm px-3" onclick="move('LEFT')">&larr;</button>
        <button class="btn btn-outline-secondary fs-3 shadow-sm px-3" onclick="move('DOWN')">&darr;</button>
        <button class="btn btn-outline-secondary fs-3 shadow-sm px-3" onclick="move('UP')">&uarr;</button>
        <button class="btn btn-outline-secondary fs-3 shadow-sm px-3" onclick="move('RIGHT')">&rarr;</button>
    </div>

    <div class="card p-3 shadow-sm text-center border-0 bg-white" style="max-width: 320px;">
        <p class="small text-muted mb-0">
            <strong>Paradigmas de Interaccion:</strong><br>
            1. <strong>Botones tactiles:</strong> Toca las flechas.<br>
            2. <strong>Gestos tactiles (Swipe):</strong> Desliza tu dedo sobre el tablero.<br>
            3. <strong>Teclado:</strong> Usa las flechas de tu teclado (en PC).
        </p>
    </div>

    <script>
        let row = 1;
        let col = 1;

        const avatar = document.getElementById('avatar');
        const board = document.getElementById('board');

        function updatePosition() {
            const targetCell = document.getElementById(`cell-${row}-${col}`);
            if (targetCell) {
                targetCell.appendChild(avatar);
            }
        }

        function move(direction) {
            if (direction === 'UP' && row > 0) row--;
            if (direction === 'DOWN' && row < 2) row++;
            if (direction === 'LEFT' && col > 0) col--;
            if (direction === 'RIGHT' && col < 2) col++;
            
            updatePosition();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') move('UP');
            if (e.key === 'ArrowDown') move('DOWN');
            if (e.key === 'ArrowLeft') move('LEFT');
            if (e.key === 'ArrowRight') move('RIGHT');
        });

        let startX = 0;
        let startY = 0;

        board.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        board.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = endX - startX;
            const diffY = endY - startY;
            const threshold = 30;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > threshold) move('RIGHT');
                else if (diffX < -threshold) move('LEFT');
            } else {
                if (diffY > threshold) move('DOWN');
                else if (diffY < -threshold) move('UP');
            }
        }, { passive: true });
    </script>
</body>
</html>
